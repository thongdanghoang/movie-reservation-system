quarkus.datasource.devservices.port=5432
quarkus.mongodb.devservices.port=27017
quarkus.mongodb.devservices.enabled=true
quarkus.datasource.devservices.reuse=true
quarkus.datasource.devservices.show-logs=true
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.flyway.locations=db/migration,db/dev
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.log.format-sql=false
quarkus.http.cors.origins=http://localhost:3000
app.frontend.base-url=http://localhost:3000